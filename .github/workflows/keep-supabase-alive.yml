# Supabase 免费版项目保活
#
# 背景：免费版项目如果「7 天内数据库活动不足」会被自动暂停。
# 官方文档：每天有几次真实的数据库请求，通常就足够保持活跃。
#
# 本工作流每 4 小时运行一次，每次做两件事：
#   1) 向 keepalive 表写入一行（写操作 = 最可靠的活跃信号，时间戳由数据库自动生成）
#   2) 读取 calc_records 表（真实表查询，附 no-cache 头）
# 即每天约 12 次真实数据库读写，稳定高于「每天几次」的标准线。
#
# 前置条件：keepalive 表已建好（RLS：匿名可插入、可读取）。
# 说明：anon key 是公开密钥（index.html 里也有），保护由 RLS 策略负责。
name: Keep Supabase Alive

on:
  schedule:
    # 每 4 小时一次（UTC 0/4/8/12/16/20 点 = 北京 08/12/16/20/00/04 点）
    - cron: '0 */4 * * *'
  workflow_dispatch: {} # 支持手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive: write + read
        run: |
          echo "== 1/2 write keepalive =="
          curl -sf -o /dev/null -w "WRITE HTTP %{http_code}\n" \
            -X POST \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            "https://nskatipsgtspvvpsrhzs.supabase.co/rest/v1/keepalive"

          echo "== 2/2 read calc_records =="
          curl -sf -o /dev/null -w "READ HTTP %{http_code}\n" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Cache-Control: no-cache" \
            "https://nskatipsgtspvvpsrhzs.supabase.co/rest/v1/calc_records?select=id&limit=1"
        env:
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5za2F0aXBzZ3RzcHZ2cHNyaHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NTgzMzQsImV4cCI6MjA5OTQzNDMzNH0.B4HvpVghYUmtWbPtClD6VZlk2yI74Utik3vx6imrcpc
